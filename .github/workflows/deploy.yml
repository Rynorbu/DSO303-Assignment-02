name: CI/CD

# Pull request -> test + terraform plan.  Push to main -> test + terraform apply + CloudFront invalidation.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC -> AWS IAM role (no stored AWS keys)
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-finished terraform apply

env:
  TF_IN_AUTOMATION: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Unit tests
        working-directory: backend
        run: |
          npm ci
          npm test
      - name: JavaScript syntax check (frontend)
        run: |
          node --check frontend/app.js
          node --check backend/local/server.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      # Repository variables are copied by hand, so strip stray spaces / line breaks
      # and fail early with a clear message if one is missing.
      - name: Read settings (GitHub repository variables)
        working-directory: .
        env:
          RAW_AWS_REGION: ${{ vars.AWS_REGION }}
          RAW_AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          RAW_TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          RAW_SES_SENDER_EMAIL: ${{ vars.SES_SENDER_EMAIL }}
          RAW_ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          RAW_SES_TEST_RECIPIENTS: ${{ vars.SES_TEST_RECIPIENTS }}
        run: bash scripts/ci-settings.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Lambda production dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Invalidate CloudFront cache
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" --query 'Invalidation.Id' --output text

      - name: Smoke test
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          URL=$(terraform output -raw app_url)
          echo "App: $URL"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL/api/health"; then echo; exit 0; fi
            sleep 20
          done
          echo "Health check failed"; exit 1
