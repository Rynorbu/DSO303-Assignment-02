name: CI/CD

# Pull request -> test + terraform plan.  Push to main -> test + terraform apply + CloudFront invalidation.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC -> AWS IAM role (no stored AWS keys)
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-finished terraform apply

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_ses_sender_email: ${{ vars.SES_SENDER_EMAIL }}
  TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
  TF_VAR_ses_test_recipients: ${{ vars.SES_TEST_RECIPIENTS || '[]' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Unit tests
        working-directory: backend
        run: |
          npm ci
          npm test
      - name: JavaScript syntax check (frontend)
        run: node --check frontend/app.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Lambda production dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Invalidate CloudFront cache
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" --query 'Invalidation.Id' --output text

      - name: Smoke test
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          URL=$(terraform output -raw app_url)
          echo "App: $URL"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL/api/health"; then echo; exit 0; fi
            sleep 20
          done
          echo "Health check failed"; exit 1
