name: Tear down

# Manual only: Actions -> "Tear down" -> Run workflow -> type DESTROY
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DESTROY to delete every resource in the stack
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    if: github.event.inputs.confirm == 'DESTROY'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - name: Read settings (GitHub repository variables)
        working-directory: .
        env:
          RAW_AWS_REGION: ${{ vars.AWS_REGION }}
          RAW_AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          RAW_TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          RAW_SES_SENDER_EMAIL: ${{ vars.SES_SENDER_EMAIL }}
          RAW_ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          RAW_SES_TEST_RECIPIENTS: ${{ vars.SES_TEST_RECIPIENTS }}
        run: bash scripts/ci-settings.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Lambda dependencies (needed to evaluate the package)
        working-directory: backend
        run: npm ci --omit=dev
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"
      - run: terraform destroy -input=false -auto-approve
