name: Tear down

# Manual only: Actions -> "Tear down" -> Run workflow -> type DESTROY
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DESTROY to delete every resource in the stack
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_ses_sender_email: ${{ vars.SES_SENDER_EMAIL }}
  TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
  TF_VAR_ses_test_recipients: ${{ vars.SES_TEST_RECIPIENTS || '[]' }}

jobs:
  destroy:
    if: github.event.inputs.confirm == 'DESTROY'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Lambda dependencies (needed to evaluate the package)
        working-directory: backend
        run: npm ci --omit=dev
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ env.AWS_REGION }}"
      - run: terraform destroy -input=false -auto-approve
