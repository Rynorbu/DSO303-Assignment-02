<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Online exams and assignment submissions for students, tutors and administrators.">
  <title>ExamHub – University Exam Platform</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before the first paint (no flash).
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app" aria-live="polite">
    <div style="display:grid;place-items:center;min-height:100vh;color:#6b7280">Loading…</div>
  </div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <noscript>This application needs JavaScript enabled.</noscript>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
